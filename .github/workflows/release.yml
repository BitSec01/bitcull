# Build installers for Windows, macOS and Linux, and attach them to a GitHub
# release.
#
# Push a tag to trigger it:
#
#     npm version minor          # bumps package.json and tags
#     git push --follow-tags
#
# The models are NOT in the repository (34 MB), so each runner fetches them
# before building; `tauri.conf.json` then bundles them as resources, and users
# get one installer that works offline with nothing to configure.

name: Release

on:
  push:
    tags: ["v*"]
  # Lets you produce installers without publishing, to test the pipeline.
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          # Both Mac architectures. Apple silicon first, as it is the common one.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux dependencies. Pinned to 22.04 because webkit2gtk-4.1
      # package names differ on 24.04.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev build-essential curl wget file

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Only the Mac jobs cross-compile; harmless elsewhere.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Rust builds dominate the wall clock here, so cache them per platform
      # and per target.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - run: npm ci

      - name: Fetch models
        run: npm run fetch-models

      - name: Verify models are present
        shell: bash
        run: |
          # A silent model download failure would produce an installer that
          # looks fine and then cannot detect anything, so fail loudly here.
          for f in object_detection_yolox_2022nov.onnx face_detection_yunet_2023mar.onnx; do
            path="src-tauri/models/$f"
            [ -f "$path" ] || { echo "missing $path"; exit 1; }
            size=$(wc -c < "$path")
            echo "$f: $size bytes"
            [ "$size" -gt 200000 ] || { echo "$f is too small, download truncated"; exit 1; }
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Culling ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
